roles:
  ie_agent:
    enabled: true
    model: "openai/gpt-4o-mini"
    fallback_models:
      - "nvidia/nemotron-3-super-120b-a12b"
      - "nvidia/nemotron-3.5-lightning"
    temperature: 0.2
    max_tokens: 2048
    timeout: 30.0

  manager:
    enabled: false
    model: "openai/gpt-4o"
    fallback_models: []
    temperature: 0.1
    max_tokens: 2048
    timeout: 30.0

  policy_interpreter:
    enabled: false
    model: "deepseek/deepseek-r1"
    fallback_models: []
    temperature: 0.0
    max_tokens: 4096
    timeout: 45.0
